und:#d8d9d5}.step:first-child:before{display:none}.dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;margin:auto auto 6px;background:#e5e3dc;border:2px solid white;box-shadow:0 0 0 1px #d3d3cc;position:relative;z-index:1}.step.done .dot,.step.now .dot{background:var(--teal);color:white;box-shadow:0 0 0 1px var(--teal)}.step.done:before,.step.now:before{background:var(--teal)}.step.now{color:var(--navy)}.movement{font-size:11px;text-transform:uppercase;letter-spacing:.16em;font-weight:850;color:var(--gold)}.stageTitle{font-size:clamp(34px,5vw,50px);margin-top:5px}.field{margin-top:24px}.prompt{font-family:var(--serif);font-size:23px;line-height:1.32;color:var(--navy);margin:0 0 7px}.help{font-size:13px;line-height:1.52;color:var(--muted);margin:0 0 11px}.field textarea,.field select{width:100%;border:1px solid rgba(16,36,58,.18);background:rgba(255,255,255,.84);border-radius:17px;padding:15px 16px;color:var(--ink);outline:0;line-height:1.5}.field textarea{min-height:128px;resize:vertical}.field textarea:focus,.field select:focus{border-color:var(--teal);box-shadow:0 0 0 4px rgba(45,119,120,.1)}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.grid3 .field{margin-top:0}.note{margin-top:18px;padding:15px 17px;border-radius:17px;border:1px solid rgba(45,119,120,.15);background:linear-gradient(135deg,rgba(45,119,120,.08),rgba(201,154,69,.08));font-size:13px;line-height:1.55;color:#46535d}.beliefs{display:grid;gap:8px}.belief{display:flex;gap:10px;padding:12px 13px;border:1px solid var(--line);border-radius:15px;background:white}.belief input{margin-top:3px;accent-color:var(--teal)}.steady{margin-top:18px;padding:21px;border-radius:20px;border:1px solid rgba(201,154,69,.28);background:linear-gradient(135deg,rgba(201,154,69,.13),rgba(45,119,120,.07))}.steady blockquote{margin:8px 0;font-family:var(--serif);font-size:20px;line-height:1.5;color:var(--navy)}.navrow{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:28px}.summaryHero{padding:25px;border-radius:23px;background:linear-gradient(145deg,var(--navy),#214e5d);color:white}.summaryHero h2{color:white;font-size:40px}.summaryHero p{color:rgba(255,255,255,.76);line-height:1.5}.summaryGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px}.sum{padding:17px;border:1px solid var(--line);border-radius:17px;background:rgba(255,255,255,.7)}.sum strong{display:block;text-transform:uppercase;letter-spacing:.1em;font-size:11px;color:var(--teal);margin-bottom:7px}.sum p{margin:0;white-space:pre-wrap;line-height:1.5}.wide{grid-column:1/-1}.wide p{font-family:var(--serif);font-size:19px;color:var(--navy)}.library{display:grid;gap:11px;margin-top:20px}.item{display:grid;grid-template-columns:1fr auto;gap:12px;padding:17px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.74)}.item h3{font-size:20px}.item p{font-size:13px;color:var(--muted);margin:6px 0 0}.actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.patternGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.pattern{padding:18px;border:1px solid var(--line);border-radius:18px;background:white}.count{font:34px var(--serif);color:var(--teal)}.pattern h3{font-size:19px;margin-top:3px}.pattern p{font-size:13px;line-height:1.5;color:var(--muted)}.pills{display:flex;gap:5px;flex-wrap:wrap}.pill{border:1px solid var(--line);border-radius:999px;background:#faf9f5;padding:7px 10px;font-size:12px}.pill.sel{background:var(--teal);color:white;border-color:var(--teal)}.laneGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.lane{border:1px solid var(--line);border-radius:17px;background:white;padding:15px;text-align:left}.lane strong{display:block;color:var(--navy);margin-bottom:4px}.lane small{color:var(--muted);line-height:1.4}.empty{margin-top:18px;padding:30px;text-align:center;border:1px dashed rgba(16,36,58,.22);border-radius:18px;color:var(--muted)}.dialogWrap{display:none;position:fixed;inset:0;z-index:50;background:rgba(8,20,31,.54);backdrop-filter:blur(7px);padding:18px;align-items:center;justify-content:center}.dialogWrap.open{display:flex}.dialog{width:min(620px,100%);max-height:90vh;overflow:auto;background:var(--paper);border-radius:25px;padding:24px;box-shadow:0 30px 90px rgba(0,0,0,.3)}.ground{padding:12px 0;border-bottom:1px solid var(--line);line-height:1.5}.setting{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.switch{width:49px;height:29px;border:0;border-radius:999px;background:#c9ccc8;padding:3px}.switch span{display:block;width:23px;height:23px;background:white;border-radius:50%;transition:.2s}.switch.on{background:var(--teal)}.switch.on span{transform:translateX(20px)}.toast{position:fixed;left:50%;bottom:22px;z-index:80;transform:translateX(-50%) translateY(20px);padding:11px 15px;border-radius:999px;background:var(--navy);color:white;font-size:13px;opacity:0;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%)}.due{margin-bottom:14px;padding:15px 17px;border-radius:17px;background:rgba(201,154,69,.13);border:1px solid rgba(201,154,69,.28);display:flex;justify-content:space-between;gap:10px;align-items:center}.due p{margin:0;font-size:13px;line-height:1.45}#printArea{display:none}@media(max-width:760px){.hero{grid-template-columns:1fr}.heroArt{min-height:300px}.dash,.summaryGrid,.patternGrid,.laneGrid,.grid3{grid-template-columns:1fr}.item{grid-template-columns:1fr}.topnav .lab{display:none}.hero h1{font-size:58px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media print{@page{size:letter;margin:.55in}.top,main,.dialogWrap,.toast{display:none!important}body{background:white!important}#printArea{display:block!important}.cover{min-height:9in;padding:.65in;border:1px solid #ddd;border-radius:24px;position:relative;page-break-after:always;background:linear-gradient(155deg,#10243a 0 44%,#f6 <script>
(function(){
"use strict";
var K={current:"fb2-current",library:"fb2-library",reviews:"fb2-reviews",prefs:"fb2-prefs"};
var stages=[["Storm","Naming the Fear","Name"],["Storm","The Weight of It","Locate"],["Orientation","Meaning Beneath the Fear","Meaning"],["Orientation","Sorting the Fear","Sort"],["Passage","A Steadier Word","Steady"],["Passage","Values and One Small Step","Choose"],["Return","Building a Return Plan","Return"],["Return","Closing","Close"]];
var beliefs=[
["not-capable","It would mean I’m not capable.","A painful outcome would not become a complete verdict on you. Struggling with one hard thing is not the same as being incapable — it is what it looks like to face something that is genuinely difficult."],
["alone","It would mean I’ll end up alone.","A painful outcome would not become a complete verdict on you. Even if this goes badly, it does not decide, on its own, who stays in your life or what you’re capable of rebuilding."],
["not-safe","It would mean I’m not safe.","A painful outcome would not become a complete verdict on you. Fear can make a single feared event feel like proof that nothing is safe. One outcome, even a hard one, is not the same as permanent danger."],
["failure","It would mean I’ve failed.","A painful outcome would not become a complete verdict on you. An outcome you didn’t want is not the same as a verdict on your worth or effort — it is one result, in one moment, not the whole account."],
["judged","It would mean people will judge me.","A painful outcome would not become a complete verdict on you. Other people’s reactions are real, and they are also not the final word on who you are or what this moment means."],
["out-of-control","It would mean I’ve lost control.","A painful outcome would not become a complete verdict on you. Facing something you can’t fully control is not the same as having no say at all in how you meet it, or what you do next."],
["unbearable","It would mean I couldn’t bear it.","A painful outcome would not become a complete verdict on you. Pain that feels unbearable in anticipation is often survivable in reality — not because it hurts less, but because you are not meeting it alone or all at once."],
["other","Something else","A painful outcome would not become a complete verdict on you. Whatever this fear is telling you about what it would mean, that meaning is a belief you are carrying — not a fact the outcome itself could prove."]
];
var themes=[["Work & money",["money","financial","bill","debt","income","job","work","career","business","payoff","return","sales","rent","mortgage","afford","cost"]],["Relationships & belonging",["relationship","partner","husband","wife","boyfriend","girlfriend","friend","family","alone","reject","abandon","love","lonely","belong"]],["Health & body",["health","body","cancer","hiv","pain","sick","medical","doctor","hospital","treatment","symptom","surgery"]],["Safety & control",["safe","safety","danger","control","uncertain","unknown","chaos","risk"]],["Failure & judgment",["fail","failure","succeed","success","judg","shame","enough","capable","worth"]],["Loss & grief",["loss","lose","lost","death","died","grief","gone"]]];
var bodyTerms=["throat","chest","stomach","belly","jaw","shoulder","neck","head","back","legs","leg","feet","foot","hands","hand","arms","arm","heart","face"];
var lanes={
understand:{t:"Understand it a little better",d:"Walk through a few questions about when and how the pattern shows up.",q:[["When does this pattern tend to show up?","Times, situations, conversations, places…"],["What seems to set it off or turn the volume up?","Anything you notice is enough."],["What helps you notice it earlier?","Body signals, thoughts, behaviors, other clues…"],["What would you like to understand better about it?","A question is enough."]]},
solve:{t:"Problem-solve something specific",d:"Work through one concrete situation connected to the pattern.",q:[["What specific situation do you want to work on?","Keep it narrow enough to hold."],["What do you know for sure?","Facts, not predictions."],["What is still uncertain?","What cannot be known yet?"],["What options do you already see?","List any possibilities, including imperfect ones."],["Which option, if any, feels workable enough to try?","You can also decide none fit yet."],["What would be one next step?","Small and specific."]]},
experiment:{t:"Choose a small experiment",d:"Pick one reversible thing to try, then notice what happens.",q:[["What would you like to try differently?","A small shift, not a personality transplant."],["How can you make it small enough to actually try?","Shrink it until it feels doable."],["How long do you want to try it?","A day, a week, one situation…"],["How will you know whether it helped?","What would you notice?"]]},
plan:{t:"Plan for the next time it shows up",d:"Build a simple response plan you can return to.",q:[["What is an early sign that this pattern is arriving?","A thought, sensation, urge, behavior…"],["What do you want to do first when you notice it?","Pause, move, write, wait, check a fact…"],["What do you want to remember in that moment?","Use your own words."],["What support, if any, would you want available?","A person, place, tool, or none."],["If it gets more intense, what would you want to do next?","Keep this practical and kind to yourself."]]},
support:{t:"Identify support",d:"Think about who or what could make the situation less solitary or more workable.",q:[["Who or what could be useful support?","A person, service, group, tool, place…"],["What kind of support would actually help?","Listening, information, practical help, company, accountability…"],["How would you like to ask for or access that support?","Write the first step."],["What boundary or condition would make support feel safer or more useful?","You get to define the terms."]]}
};
var cur=null,stage=1,selected=null,reviewDraft=null,audio=null;
function $(s){return document.querySelector(s)}function all(s){return Array.prototype.slice.call(document.querySelectorAll(s))}
function esc(s){return String(s==null?"":s).replace(/[&<>'"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]})}
function uid(){return (crypto.randomUUID?crypto.randomUUID():"fb-"+Date.now()+"-"+Math.random().toString(16).slice(2))}
function read(k,d){try{var x=JSON.parse(localStorage.getItem(k));return x==null?d:x}catch(e){return d}}function write(k,v){localStorage.setItem(k,JSON.stringify(v))}

function blank(){return{id:uid(),createdAt:new Date().toISOString(),completedAt:null,stage:1,fear:"",weight:"",meaning:"",sort:{realistic:"",exaggerated:"",unknown:""},beliefId:"",statementText:"",values:"",coping:"",smallStep:"",immediateAfter:"",whoToContact:"",selfCare:"",closing:""}}
function show(id){all(".view").forEach(function(v){v.classList.remove("on")});$("#"+id).classList.add("on");window.scrollTo({top:0,behavior:"smooth"})}
function fmt(x){return new Intl.DateTimeFormat(undefined,{month:"short",day:"numeric",year:"numeric"}).format(new Date(x))}

function saveCur(){if(!cur)return;cur.stage=stage;if(pref().autosave)write(K.current,cur)}
function home(){
var n=lib().length,r=lib().filter(function(p){return Date.now()-new Date(p.completedAt||p.createdAt).getTime()<=2592000000}).length;
$("#home").innerHTML='<div class="hero"><div class="panel heroCopy"><div class="eyebrow">The Sovereign Source™ · Guided Practice</div><h1>Fear<span>Buster</span></h1><p class="lede">Turn toward a fear without handing it the steering wheel. Name what is happening, sort what you know from what fear adds, and choose what comes next.</p><div class="row"><button class="btn primary" id="begin">Begin a practice</button>'+(read(K.current,null)?'<button class="btn secondary" id="resume">Resume unfinished practice</button>':'')+'</div><div class="privacy">● Your entries stay in this browser unless you choose to export them.</div></div><div class="panel heroArt"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div class="heroQuote"><small>Fear does not have to disappear first</small>You can make room for fear without giving it final authority.</div></div></div><div class="dash"><div class="mini"><strong>Your FearBuster Collection</strong><p>'+(n?n+' saved practice'+(n===1?'':'s')+' on this device.':'Finished practices can live here on this device.')+'</p><button class="btn ghost" id="goLib">Open collection</button></div><div class="mini"><strong>30-Day Reflection</strong><p>'+(r?r+' practice'+(r===1?'':'s')+' in the last 30 days.':'Patterns become more useful after a few practices.')+'</p><button class="btn ghost" id="goReview">Look for patterns</button></div><div class="mini"><strong>Your pace, your call</strong><p>Pause, save what matters, or stop. Nothing here needs to be forced.</p><button class="btn ghost" id="goGround">Pause & Ground</button></div></div>';
$("#begin").onclick=function(){cur=blank();stage=1;saveCur();renderStage()};if($("#resume"))$("#resume").onclick=function(){cur=read(K.current,null);stage=cur.stage||1;renderStage()};$("#goLib").onclick=renderLibrary;$("#goReview").onclick=renderReview;$("#goGround").onclick=openGround;show("home");renderDue()
}

function renderStage(){
if(!cur)cur=read(K.current,null)||blank();saveCur();var m=stages[stage-1],b="";
if(stage===1)b=tf("fear","What are you afraid might happen?","Name it as plainly as you can. There is no need to make it sound smaller or larger than it is.","I am afraid that…");
if(stage===2)b=tf("weight","What does carrying this fear feel like right now?","Notice where it shows up — in your body, your thoughts, your day. Whatever comes up is worth writing down.","When I think about this, I notice…");

if(stage===4)b='<div class="note">Fear can be honest about the presence of risk and less reliable about its size. Sort what you can without forcing certainty.</div><div class="grid3">'+sf("realistic","What could realistically happen?","The plausible version, based on what you actually know.","Realistically…")+sf("exaggerated","What is fear adding or exaggerating?","The parts that may be fear filling in gaps.","Fear may be adding…")+sf("unknown","What remains unknown?","What you genuinely cannot know yet.","I don’t yet know…")+'</div>';

if(stage===6)b=tf("values","What matters to you enough to move toward this fear anyway?","A person, a value, a version of your life you want to keep building.","What matters is…")+tf("coping","What has helped you get through hard things before?","People, practices, places, reminders — anything real that has worked before.","What has helped before…")+tf("smallStep","What is one small, specific step you could take?","Small enough to actually do. This is not the whole passage, just the next part.","One small step…");
if(stage===7)b='<div class="note">A return plan is what waits for you on the other side, so you are not left there alone.</div>'+tf("immediateAfter","What will you do right after you face this?","The first small action, in the minutes right after.","Right after, I will…")+tf("whoToContact","Who could you reach out to, if you wanted to?","A name, or a way to reach someone — no pressure to use it.","I could reach out to…")+tf("selfCare","What would help you feel steady again afterward?","Rest, food, movement, quiet — whatever actually helps you.","It would help to…");
if(stage===8)b=tf("closing","Is there anything else you want to say to yourself, before you close this practice?","Optional. This is the last thing you will read here today.","One more thing…");
$("#practice").innerHTML='<div class="panel card"><div class="movement">'+m[0]+'</div><h2 class="stageTitle">'+m[1]+'</h2>'+journey()+b+'<div class="navrow"><button class="btn ghost" id="back">'+(stage===1?"Home":"Back")+'</button><button class="btn primary" id="next">'+(stage===8?"Complete the practice":"Continue")+'</button></div></div>';
bindFields();show("practice");$("#back").onclick=function(){capture();if(stage===1)home();else{stage--;saveCur();renderStage()}};$("#next").onclick=function(){capture();var e=valid();if(e){toast(e);return}if(stage===8)complete();else{stage++;saveCur();renderStage()}};if(stage===5)renderSteady()
}
function sf(k,p,h,ph){return '<div class="field"><p class="prompt">'+p+'</p><p class="help">'+h+'</p><textarea id="s-'+k+'" placeholder="'+ph+'">'+esc(cur.sort[k])+'</textarea></div>'}
function bindFields(){all("#practice textarea").forEach(function(x){x.oninput=function(){capture();saveCur()}});all('input[name="belief"]').forEach(function(x){x.onchange=function(){cur.beliefId=x.value;cur.statementText=(beliefs.find(function(b){return b[0]===x.value})||[])[2]||"";saveCur();renderSteady()}})}
function capture(){function v(id){return $("#"+id)?$("#"+id).value:null}if(stage===1&&v("f-fear")!==null)cur.fear=v("f-fear");if(stage===2&&v("f-weight")!==null)cur.weight=v("f-weight");if(stage===3&&v("f-meaning")!==null)cur.meaning=v("f-meaning");if(stage===4){cur.sort.realistic=v("s-realistic")||"";cur.sort.exaggerated=v("s-exaggerated")||"";cur.sort.unknown=v("s-unknown")||""}if(stage===5&&v("steadyText")!==null)cur.statementText=v("steadyText");if(stage===6){cur.values=v("f-values")||"";cur.coping=v("f-coping")||"";cur.smallStep=v("f-smallStep")||""}if(stage===7){cur.immediateAfter=v("f-immediateAfter")||"";cur.whoToContact=v("f-whoToContact")||"";cur.selfCare=v("f-selfCare")||""}if(stage===8)cur.closing=v("f-closing")||""}
function valid(){var ok={1:cur.fear,2:cur.weight,3:cur.meaning,4:cur.sort.realistic,5:cur.beliefId&&cur.statementText,6:cur.smallStep,7:cur.immediateAfter,8:true}[stage];return ok?"":"Write enough here to give yourself something to work with. You can keep it brief."}
function renderSteady(){var d=$("#steady");if(!d||!cur.beliefId)return;d.innerHTML='<div class="steady"><div class="eyebrow">A steadier way to hold it</div><blockquote>'+esc(cur.statementText)+'</blockquote><div class="field"><p class="help">Edit this until it feels true enough to use. You may replace it entirely.</p><textarea id="steadyText">'+esc(cur.statementText)+'</textarea></div></div>';$("#steadyText").oninput=function(){cur.statementText=this.value;saveCur()}}
function complete(){capture();cur.completedAt=new Date().toISOString();var l=lib(),i=l.findIndex(function(p){return p.id===cur.id});if(i>=0)l[i]=cur;else l.unshift(cur);write(K.library,l);localStorage.removeItem(K.current);selected=cur;renderSummary(cur,true);cur=null;stage=1}
function sum(h,t,wide){return t?'<div class="sum '+(wide?"wide":"")+'"><strong>'+h+'</strong><p>'+esc(t)+'</p></div>':""}
function renderSummary(p,finished){selected=p;$("#summary").innerHTML='<div class="panel card"><div class="summaryHero"><div class="eyebrow" style="color:#e6c983">'+(finished?"Practice complete":"Saved practice")+'</div><h2>'+(finished?"You made room for the fear.":"FearBuster practice")+'</h2><p>'+(finished?"You did not have to solve your whole life. You named what was here, sorted what you could, and chose a place to return.":"Saved "+fmt(p.completedAt||p.createdAt)+".")+'</p></div><div class="summaryGrid">'+sum("Naming the fear",p.fear)+sum("The weight of it",p.weight)+sum("Meaning beneath the fear",p.meaning)+sum("Realistic",p.sort.realistic)+sum("Fear may be adding",p.sort.exaggerated)+sum("Still unknown",p.sort.unknown)+sum("What matters",p.values)+sum("What has helped",p.coping)+sum("One small step",p.smallStep)+sum("Right after",p.immediateAfter)+sum("Who I could reach out to",p.whoToContact)+sum("What helps me feel steady",p.selfCare)+sum("A steadier word",p.statementText,true)+sum("Closing reflection",p.closing,true)+'</div><div class="row" style="margin-top:16px"><button class="btn primary" id="printP">Save / Print PDF</button><button class="btn secondary" id="textP">Download text</button><button class="btn ghost" id="backL">Collection</button></div><p class="sub" style="font-size:12px">“Save / Print PDF” opens your device’s print dialog. Choose Save as PDF or your device’s equivalent.</p></div>';show("summary");$("#printP").onclick=function(){printPractice(p)};$("#textP").onclick=function(){downloadText(p)};$("#backL").onclick=renderLibrary}
function practiceText(p){return "FearBuster — Practice Summary\nSaved "+fmt(p.completedAt||p.createdAt)+"\n\nNaming the Fear\n"+p.fear+"\n\nThe Weight of It\n"+p.weight+"\n\nMeaning Beneath the Fear\n"+p.meaning+"\n\nSorting the Fear\nRealistic: "+p.sort.realistic+"\nFear may be adding: "+p.sort.exaggerated+"\nStill unknown: "+p.sort.unknown+"\n\nA Steadier Word\n"+p.statementText+"\n\nValues and One Small Step\nWhat matters: "+p.values+"\nWhat has helped before: "+p.coping+"\nOne small step: "+p.smallStep+"\n\nReturn Plan\nRight after: "+p.immediateAfter+"\nWho to reach out to: "+p.whoToContact+"\nWhat helps me feel steady: "+p.selfCare+"\n\nClosing Reflection\n"+(p.closing||"")}
function download(name,text,type){var a=document.createElement("a"),u=URL.createObjectURL(new Blob([text],{type:type||"text/plain;charset=utf-8"}));a.href=u;a.download=name;a.click();setTimeout(function(){URL.revokeObjectURL(u)},500)}
function downloadText(p){download("fearbuster-"+p.id.slice(0,8)+".txt",practiceText(p))}
function ps(h,t,hi){return '<section class="printSec '+(hi?"hi":"")+'"><h2>'+esc(h)+'</h2><p>'+esc(t||"")+'</p></section>'}
function printPractice(p){$("#printArea").innerHTML='<div class="cover"><h1>FearBuster</h1><div class="date">Practice saved '+fmt(p.completedAt||p.createdAt)+'</div><div class="quote">“'+esc(p.statementText||p.closing||p.smallStep||p.fear)+'”</div></div><h1 class="printTitle">Your FearBuster Practice</h1>'+ps("Naming the Fear",p.fear)+ps("The Weight of It",p.weight)+ps("Meaning Beneath the Fear",p.meaning)+ps("Sorting the Fear","Realistic: "+p.sort.realistic+"\n\nFear may be adding: "+p.sort.exaggerated+"\n\nStill unknown: "+p.sort.unknown)+ps("A Steadier Word",p.statementText,true)+ps("Values and One Small Step","What matters: "+p.values+"\n\nWhat has helped before: "+p.coping+"\n\nOne small step: "+p.smallStep)+ps("Return Plan","Right after: "+p.immediateAfter+"\n\nWho I could reach out to: "+p.whoToContact+"\n\nWhat helps me feel steady: "+p.selfCare)+(p.closing?ps("Closing Reflection",p.closing,true):"")+'<div class="footer">FearBuster · The Sovereign Source™ · Stored locally unless you choose to export it.</div>';window.print()}
function renderLibrary(){var l=lib();$("#library").innerHTML='<div class="panel card"><div class="eyebrow">Your device · Your records</div><h2 class="title">FearBuster Collection</h2><p class="sub">Completed practices are stored only in this browser on this device unless you export them. Clearing browser data can remove them, so download a backup if you want to keep the collection long-term.</p><div class="row"><button class="btn primary" id="newP">New practice</button><button class="btn secondary" id="backup">Download collection backup</button></div>'+(l.length?'<div class="library">'+l.map(function(p){return '<div class="item"><div><h3>Practice · '+fmt(p.completedAt||p.createdAt)+'</h3><p>'+esc((p.fear||"Saved practice").slice(0,100))+'</p></div><div class="actions"><button class="btn ghost" data-open="'+p.id+'">Open</button><button class="btn ghost" data-pdf="'+p.id+'">PDF</button><button class="btn ghost danger" data-del="'+p.id+'">Delete</button></div></div>'}).join("")+'</div>':'<div class="empty">Your collection is empty. Completed practices will appear here.</div>')+'</div>';show("library");$("#newP").onclick=function(){cur=blank();stage=1;saveCur();renderStage()};$("#backup").onclick=backup;all("[data-open]").forEach(function(b){b.onclick=function(){renderSummary(l.find(function(p){return p.id===b.dataset.open}),false)}});all("[data-pdf]").forEach(function(b){b.onclick=function(){printPractice(l.find(function(p){return p.id===b.dataset.pdf}))}});all("[data-del]").forEach(function(b){b.onclick=function(){if(confirm("Delete this practice from this browser?")){write(K.library,l.filter(function(p){return p.id!==b.dataset.del}));renderLibrary()}}})}
function backup(){download("fearbuster-collection-"+new Date().toISOString().slice(0,10)+".json",JSON.stringify({version:2,exportedAt:new Date().toISOString(),practices:lib(),reviews:revs()},null,2),"application/json")}
function patterns(pset){var out=[],total=pset.length;themes.forEach(function(t){var n=0;pset.forEach(function(p){var x=[p.fear,p.meaning,p.sort.realistic,p.sort.exaggerated,p.sort.unknown,p.values,p.smallStep].join(" ").toLowerCase();if(t[1].some(function(w){return x.indexOf(w)>=0}))n++});if(n>=2)out.push({id:"t-"+t[0],label:t[0],count:n,detail:"Language connected with "+t[0].toLowerCase()+" appeared in "+n+" of "+total+" practices."})});var body={};pset.forEach(function(p){var x=(p.weight||"").toLowerCase();bodyTerms.forEach(function(t){if(x.indexOf(t)>=0)body[t]=(body[t]||0)+1})});Object.keys(body).filter(function(k){return body[k]>=2}).sort(function(a,b){return body[b]-body[a]}).slice(0,3).forEach(function(k){out.push({id:"b-"+k,label:"Body: "+k,count:body[k],detail:k.charAt(0).toUpperCase()+k.slice(1)+" appeared in your body/weight notes in "+body[k]+" of "+total+" practices."})});var bc={};pset.forEach(function(p){if(p.beliefId)bc[p.beliefId]=(bc[p.beliefId]||0)+1});Object.keys(bc).filter(function(k){return bc[k]>=2}).slice(0,2).forEach(function(k){var b=beliefs.find(function(x){return x[0]===k});out.push({id:"c-"+k,label:b?b[1]:"Repeated belief",count:bc[k],detail:"This belief choice appeared in "+bc[k]+" of "+total+" practices."})});return out}
function renderReview(){var pset=lib().filter(function(p){return Date.now()-new Date(p.completedAt||p.createdAt).getTime()<=2592000000}),pat=patterns(pset);reviewDraft={id:uid(),createdAt:new Date().toISOString(),practiceIds:pset.map(function(p){return p.id}),patternResponses:{},lane:null,answers:{},followUp:"next",status:"draft"};$("#review").innerHTML='<div class="panel card"><div class="eyebrow">Last 30 days</div><h2 class="title">What seems to be showing up?</h2><p class="sub">FearBuster is looking only at entries saved on this device. These are possible patterns, not conclusions. You decide whether they fit.</p>'+(pset.length?'<div class="note">'+pset.length+' practice'+(pset.length===1?'':'s')+' in the last 30 days.'+(pset.length<3?' With only a few entries, treat everything here as especially tentative.':'')+'</div>':'<div class="empty">There are no completed practices from the last 30 days yet.</div>')+(pat.length?'<div class="patternGrid">'+pat.map(function(p){return '<div class="pattern"><div class="count">'+p.count+'</div><h3>'+esc(p.label)+'</h3><p>'+esc(p.detail)+'</p><div class="pills"><button class="pill" data-fit="'+esc(p.id)+'" data-v="fits">Fits</button><button class="pill" data-fit="'+esc(p.id)+'" data-v="somewhat">Somewhat</button><button class="pill" data-fit="'+esc(p.id)+'" data-v="no">Not for me</button></div></div>'}).join("")+'</div>':pset.length?'<div class="note">Nothing repeated strongly enough for FearBuster to call it a pattern yet. That is also useful information.</div>':'')+'<div id="choice"></div></div>';show("review");all("[data-fit]").forEach(function(b){b.onclick=function(){reviewDraft.patternResponses[b.dataset.fit]=b.dataset.v;all('[data-fit="'+b.dataset.fit+'"]').forEach(function(x){x.classList.remove("sel")});b.classList.add("sel")}});renderChoices()}
function renderChoices(){var c=$("#choice");if(!c)return;c.innerHTML='<div style="margin-top:26px"><div class="eyebrow">Your choice</div><h3 style="font-size:29px;margin-top:6px">Is there anything you would like to do with what you noticed?</h3><p class="sub">Nothing is a valid choice. Pick a direction only if it would be useful.</p><div class="laneGrid"><button class="lane" data-lane="none"><strong>Nothing right now</strong><small>Save the reflection and leave it there.</small></button>'+Object.keys(lanes).map(function(k){return '<button class="lane" data-lane="'+k+'"><strong>'+lanes[k].t+'</strong><small>'+lanes[k].d+'</small></button>'}).join("")+'<button class="lane" data-lane="later"><strong>Come back to this later</strong><small>Save what you noticed without opening another process.</small></button></div></div>';all("[data-lane]").forEach(function(b){b.onclick=function(){chooseLane(b.dataset.lane)}})}
function chooseLane(k){reviewDraft.lane=k;if(k==="none"||k==="later"){saveReview();return}var L=lanes[k];$("#choice").innerHTML='<div style="margin-top:26px"><div class="eyebrow">'+esc(L.t)+'</div><h3 style="font-size:29px;margin-top:6px">Walk it through at your pace.</h3><p class="sub">Answer only what is useful. FearBuster is not deciding for you; it is giving the questions somewhere to sit.</p>'+L.q.map(function(q,i){return '<div class="field"><p class="prompt" style="font-size:20px">'+esc(q[0])+'</p><p class="help">'+esc(q[1])+'</p><textarea data-q="'+i+'" placeholder="Write what fits…"></textarea></div>'}).join("")+'<div class="field"><p class="prompt" style="font-size:20px">When would you like FearBuster to put this back in front of you?</p><select id="follow"><option value="next">Next time I open FearBuster</option><option value="7">In about 7 days</option><option value="14">In about 14 days</option><option value="30">In about 30 days</option><option value="none">No reminder</option></select></div><div class="row"><button class="btn primary" id="saveR">Save this reflection</button><button class="btn ghost" id="changeR">Choose a different direction</button></div></div>';all("[data-q]").forEach(function(t){t.oninput=function(){reviewDraft.answers[t.dataset.q]=t.value}});$("#follow").onchange=function(){reviewDraft.followUp=this.value};$("#saveR").onclick=saveReview;$("#changeR").onclick=renderChoices}
function saveReview(){reviewDraft.status="saved";reviewDraft.savedAt=new Date().toISOString();if(reviewDraft.followUp!=="none"&&reviewDraft.followUp!=="next")reviewDraft.dueAt=new Date(Date.now()+Number(reviewDraft.followUp)*86400000).toISOString();var r=revs();r.unshift(reviewDraft);write(K.reviews,r);$("#choice").innerHTML='<div class="steady"><div class="eyebrow">Reflection saved</div><blockquote>'+(reviewDraft.lane==="none"?"You noticed what was there and chose not to turn it into a project.":reviewDraft.lane==="later"?"You can come back when there is more room for it.":"You chose a direction without handing FearBuster the decision.")+'</blockquote></div><div class="row"><button class="btn primary" id="printR">Save / Print 30-Day Reflection</button><button class="btn secondary" id="homeR">Return home</button></div>';$("#printR").onclick=function(){printReview(reviewDraft)};$("#homeR").onclick=home;renderDue()}
function printReview(r){var pset=lib().filter(function(p){return r.practiceIds.indexOf(p.id)>=0}),pat=patterns(pset),L=r.lane&&lanes[r.lane];$("#printArea").innerHTML='<div class="cover"><h1>FearBuster</h1><div class="date">30-Day Reflection · '+fmt(r.createdAt)+'</div><div class="quote">Patterns are invitations to notice, not verdicts about who you are.</div></div><h1 class="printTitle">Your 30-Day Reflection</h1>'+pat.map(function(p){return ps(p.label,p.detail+"\n\nYour read: "+(r.patternResponses[p.id]||"not marked"))}).join("")+(L?ps(L.t,L.q.map(function(q,i){return q[0]+"\n"+(r.answers[i]||"")}).join("\n\n"),true):ps("Your choice",r.lane==="later"?"Come back to this later.":"Nothing right now.",true))+'<div class="footer">FearBuster · The Sovereign Source™ · You decide what any pattern means and what, if anything, to do next.</div>';window.print()}
function renderDue(){var rs=revs(),d=rs.find(function(r){return r.status==="saved"&&!r.acknowledged&&((r.followUp==="next")||(r.dueAt&&new Date(r.dueAt)<=new Date()))});if(!d){$("#due").innerHTML="";return}$("#due").innerHTML='<div class="due"><p><strong>A FearBuster reflection is ready to revisit.</strong><br><span class="sub">'+(d.followUp==="next"?"You asked to see it when you returned.":"You asked to see it around "+fmt(d.dueAt)+".")+'</span></p><div class="row"><button class="btn secondary" id="openDue">Open</button><button class="btn ghost" id="dismissDue">Not now</button></div></div>';$("#openDue").onclick=function(){d.acknowledged=true;write(K.reviews,rs);printReview(d)};$("#dismissDue").onclick=function(){d.acknowledged=true;write(K.reviews,rs);renderDue()}}
function openDialog(html){var d=$("#dialog");d.innerHTML='<div class="dialog">'+html+'</div>';d.classList.add("open");d.onclick=function(e){if(e.target===d)closeDialog()}}function closeDialog(){$("#dialog").classList.remove("open")}
function openGround(){openDialog('<button class="btn ghost" id="x" style="float:right">Close</button><div class="eyebrow">Pause & Ground</div><h2>Take this at whatever pace helps.</h2><div class="ground">1. Place both feet on the floor, if comfortable.</div><div class="ground">2. Name three things you can see.</div><div class="ground">3. Notice one place in your body that feels neutral or supported.</div><div class="ground">4. Remind yourself: “I am here. The feared outcome is not happening in this moment.”</div><button class="btn primary" id="ret" style="margin-top:16px">Return to where I was</button>');$("#x").onclick=closeDialog;$("#ret").onclick=closeDialog}
function openSettings(){var p=pref();openDialog('<button class="btn ghost" id="x" style="float:right">Close</button><div class="eyebrow">Privacy & atmosphere</div><h2>Your FearBuster settings</h2><div class="setting"><div><strong>Autosave in this browser</strong><div class="sub" style="font-size:12px">Keeps unfinished work on this device.</div></div><button class="switch '+(p.autosave?"on":"")+'" id="auto"><span></span></button></div><div class="setting"><div><strong>Optional ambient soundscape</strong><div class="sub" style="font-size:12px">Off by default. Generated locally in your browser; nothing is streamed.</div></div><button class="switch '+(p.sound?"on":"")+'" id="sound"><span></span></button></div><div class="note"><strong>Privacy:</strong> Your entries are stored only in this browser on this device unless you choose to export them. Other people with access to this device or browser profile may be able to view them.</div>');$("#x").onclick=closeDialog;$("#auto").onclick=function(){var q=pref();q.autosave=!q.autosave;write(K.prefs,q);this.classList.toggle("on",q.autosave);if(!q.autosave)localStorage.removeItem(K.current)};$("#sound").onclick=function(){var q=pref();q.sound=!q.sound;write(K.prefs,q);this.classList.toggle("on",q.sound);q.sound?startSound():stopSound()}}
function startSound(){if(audio)return;try{var C=window.AudioContext||window.webkitAudioContext,ctx=new C(),g=ctx.createGain(),o1=ctx.createOscillator(),o2=ctx.createOscillator();g.gain.value=.016;g.connect(ctx.destination);o1.type="sine";o2.type="sine";o1.frequency.value=174;o2.frequency.value=261.6;o1.connect(g);o2.connect(g);o1.start();o2.start();audio={ctx:ctx,o1:o1,o2:o2}}catch(e){toast("Sound is not available in this browser.")}}
function stopSound(){if(!audio)return;try{audio.o1.stop();audio.o2.stop();audio.ctx.close()}catch(e){}audio=null}
$("#homeBtn").onclick=home;$("#libBtn").onclick=renderLibrary;$("#reviewBtn").onclick=renderReview;$("#groundBtn").onclick=openGround;$("#settingsBtn").onclick=openSettings;if(pref().sound)startSound();home();
})();
</script>
